algorithm: FedTT
model: resnet50 
dataset: cifar100 


set_seed: True 
seed: 16666 

client_num: 30 
client_join_ratio: 0.3 #Ratio for (client each round) / (client num in total).
global_epoch: 300
local_epoch: 4
batch_size: 512 # Data batch size for client local training.
t_batch_size: 2048
client_eval: False

lr: 0.01 # Learning rate for client local training.
momentum: 0.0 # Momentum for client local opitimizer.
weight_decay: 0.0 # Weight decay for client local optimizer.

# record
save_log: 1 # Non-zero value for saving algorithm running log

# wandb record
wandb: 1
project: "cifar100_16666"
experiment_name: "FedTT_r3_512"


r: 0.3
start: 0.0
max_gpu_memory_GB: 22
device: "cuda:0"