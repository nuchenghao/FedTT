algorithm: fedsampling
dataset: cinic10
model: resnet34

set_seed: true
seed: 166666


client_num: 100

batch_size: 512 # trainloader batch size
t_batch_size: 2048 # testloader batch size

client_join_ratio: 0.3 # Each time, client_join_ratio * client_num clients are selected to participate in training.
global_epoch: 300
local_epoch: 4

# parameter for torch.optim.SGD
lr: 0.01
momentum: 0.0
weight_decay: 0.0

save_log: 1

# wandb setting
wandb: 1 # wandb: 1 record, 0 not
project: cinic10_166666
experiment_name: fedsampling_512



client_eval: false # Whether to perform testing on the client side.
device: cuda:0 # Store output logs locally.

KN: 0.8 # parameter for fedsampling
