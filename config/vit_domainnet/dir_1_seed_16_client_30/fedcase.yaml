algorithm: fedcase
dataset: domainnet 
model: vit 


set_seed: True 
seed: 16 

client_num: 30 
client_join_ratio: 0.3 #Ratio for (client each round) / (client num in total).

global_epoch: 100
local_epoch: 1

batch_size: 64 # trainloader batch size
t_batch_size: 512 # trainloader batch size

# parameter for torch.optim.SGD
lr: 0.01 # Learning rate for client local training.
momentum: 0.0 # Momentum for client local opitimizer.
weight_decay: 0.0 # Weight decay for client local optimizer.


# wandb record
wandb: 1 # wandb: 1 record, 0 not
project: domainnet_16
experiment_name: fedcase

R_S: 0.9 # parameter for fedcase
alpha: 0.0 # parameter for fedcase

client_eval: False # Whether to perform testing on the client side.
save_log: 1 # Non-zero value for saving algorithm running log 
device: "cuda:0"
